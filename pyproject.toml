[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "MangaSpreadFuser"
description = "Fuse split manga spread pages in CBZ"
authors = [
	{ name = 'Sven "DrMcCoy" Hesse', email = "drmccoy@drmccoy.de" }
]
classifiers = [
	"Private :: Do No Upload",
	"License :: OSI Approved :: GNU Affero General Public License v3.0 or later (AGPL-3.0-or-later)"
]
requires-python = ">=3.14"
dependencies = [
	"PySide6",
	"pillow",
	"xdg",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
	"autopep8",
	"flake8",
	"isort",
	"mypy",
	"pylint",
	"types-setuptools",
]

[project.scripts]
mangaspreadfuser = "main:main"

[tool.setuptools-git-versioning]
enabled = true
version_callback = "src.version:get_version"
